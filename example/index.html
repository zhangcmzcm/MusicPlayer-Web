<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>风与叶 · 嫩叶绿主题示例</title>
    <style>
      :root {
        --green-light: #e6efcb;
        --green-base: #c8dda4;
        --green-deep: #abc879;
        --leaf-white: #ffffff;
        --green-action: #62894b;
        --ink: #30492f;
        --ink-muted: #607153;
        --line: #d8e2ce;
      }
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .page {
        position: relative; isolation: isolate; overflow: hidden;
        min-height: 100svh;
        background: radial-gradient(ellipse at 12% 2%, var(--green-light), transparent 61%), radial-gradient(ellipse at 88% 90%, #bed68e, transparent 65%), linear-gradient(125deg, var(--green-base), var(--green-deep));
      }
      .page::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(120deg, transparent 20%, #f8ffde24 35%, transparent 47%, #f8ffde18 63%, transparent 73%); }
      .masthead { position: absolute; top: 35px; left: 48px; right: 48px; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
      .brand { display: flex; align-items: center; gap: 11px; }
      .brand svg { width: 30px; height: 36px; }
      .brand-name { font-size: 18px; letter-spacing: 5px; font-weight: 500; }
      .edition { color: #536d42; font-size: 10px; letter-spacing: 2.5px; }
      .wind { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; overflow: visible; }
      .wind g { animation: breeze 18s ease-in-out infinite alternate; }
      .wind .far { animation-duration: 22s; animation-direction: alternate-reverse; }
      .scattered { position: absolute; inset: 0; pointer-events: none; z-index: -1; }
      .small-leaf { position: absolute; width: 76px; height: 100px; opacity: .64; animation: float 14s ease-in-out infinite alternate; }
      .small-leaf:nth-child(1) { left: 19%; top: 20%; transform: rotate(-38deg); }
      .small-leaf:nth-child(2) { right: 16%; top: 27%; width: 100px; height: 130px; transform: rotate(30deg); animation-delay: -6s; }
      .small-leaf:nth-child(3) { left: 9%; top: 61%; width: 100px; transform: rotate(-92deg); animation-delay: -3s; }
      .small-leaf:nth-child(4) { right: 10%; top: 62%; width: 64px; transform: rotate(60deg); animation-delay: -9s; }
      .small-leaf:nth-child(5) { left: 25%; bottom: 7%; width: 55px; transform: rotate(20deg); animation-delay: -5s; }
      .small-leaf:nth-child(6) { right: 25%; bottom: 5%; width: 70px; transform: rotate(110deg); animation-delay: -11s; }
      main { min-height: 100svh; display: grid; place-items: center; padding: 62px 0 48px; }
      .leaf-stage { position: relative; width: 740px; height: 760px; }
      .main-leaf { position: absolute; width: 100%; height: 100%; inset: 0; overflow: visible; }
      .login-look { position: absolute; top: 227px; left: 239px; width: 280px; }
      .eyebrow { display: flex; align-items: center; gap: 10px; color: var(--green-action); font-size: 9px; letter-spacing: 2.7px; }
      .eyebrow::before { content: ""; width: 22px; height: 1px; background: #97b47c; }
      h1 { font-family: "Songti SC", "STSong", "SimSun", serif; font-weight: 400; font-size: 35px; letter-spacing: 3px; margin: 17px 0 12px; }
      .intro { font-size: 12px; letter-spacing: 1px; line-height: 1.8; color: var(--ink-muted); margin: 0 0 30px; }
      .field { display: block; margin-bottom: 18px; }
      .field-name { display: block; font-size: 11px; margin-bottom: 8px; letter-spacing: 1px; }
      .input-wrap { display: flex; align-items: center; gap: 10px; height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 0 13px; background: #fbfcf9; }
      .input-wrap svg { width: 16px; height: 16px; flex: 0 0 auto; stroke: #7f9470; }
      input { width: 100%; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 12px; padding: 0; outline: none; }
      input::placeholder { color: #78836f; opacity: 1; }
      .input-wrap:focus-within { outline: 2px solid #8aa66d; outline-offset: 3px; }
      .login-button { width: 100%; height: 45px; border: 0; border-radius: 30px; background: var(--green-action); color: white; font-size: 13px; letter-spacing: 6px; margin-top: 6px; opacity: 1; -webkit-text-fill-color: white; box-shadow: 0 6px 15px #62894b1a; }
      .registration-look { text-align: center; color: var(--ink-muted); font-size: 11px; margin-top: 21px; }
      .registration-look span { color: #4f733c; margin-left: 6px; }
      .quiet-note { position: absolute; bottom: 23px; width: 100%; margin: 0; text-align: center; color: #506b3e; font-size: 10px; letter-spacing: 2px; }
      .side-note { position: absolute; left: 48px; bottom: 73px; color: #526e40; }
      .side-note p { font-family: "Songti SC", "STSong", "SimSun", serif; margin: 0 0 8px; font-size: 17px; letter-spacing: 4px; }
      .side-note small { font-size: 9px; letter-spacing: 2px; }
      @keyframes breeze { from { translate: -15px 8px; opacity: .55; } to { translate: 20px -12px; opacity: .95; } }
      @keyframes float { from { translate: 0 0; } to { translate: 10px -14px; } }
      @media (max-width: 900px) { .side-note { display: none; } .masthead { left: 28px; right: 28px; top: 25px; } }
      @media (max-width: 600px) {
        .masthead { left: 22px; right: 22px; top: 23px; }
        .brand-name { font-size: 15px; } .edition { font-size: 8px; letter-spacing: 1px; }
        main { padding-top: 75px; padding-bottom: 60px; }
        .leaf-stage { width: 100%; height: 660px; }
        .main-leaf { width: 550px; height: 660px; left: calc(50% - 275px); }
        .login-look { width: min(250px, calc(100vw - 90px)); left: 50%; top: 191px; transform: translateX(-50%); }
        h1 { font-size: clamp(24px, 7.7vw, 30px); letter-spacing: 2px; } .intro { margin-bottom: 25px; }
        .small-leaf:nth-child(1) { left: 0; top: 14%; width: 47px; }
        .small-leaf:nth-child(2) { right: -8px; top: 20%; width: 60px; }
        .small-leaf:nth-child(3) { left: -25px; top: 70%; width: 60px; }
        .small-leaf:nth-child(4) { right: -10px; top: 78%; width: 54px; }
        .small-leaf:nth-child(n+5) { display: none; }
        .quiet-note { font-size: 9px; letter-spacing: 1px; bottom: 20px; }
      }
      @media (prefers-reduced-motion: reduce) { .wind g, .small-leaf { animation: none; } }
    </style>
  </head>
  <body>
    <div class="page">
      <svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>
        <linearGradient id="small-fill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f8de"/><stop offset="1" stop-color="#c4db9c"/></linearGradient>
        <symbol id="small-leaf" viewBox="0 0 90 120"><path d="M24 108C-4 71 12 39 68 10C64 48 97 80 24 108Z" fill="url(#small-fill)" stroke="#eff5d7" stroke-width="1.1"/><path d="M21 115Q32 64 68 10M30 85L18 63M41 61L64 54" fill="none" stroke="#f5f8e8" stroke-opacity=".65"/></symbol>
      </defs></svg>
      <header class="masthead"><div class="brand"><svg viewBox="0 0 32 38" fill="none" aria-hidden="true"><path d="M9 30C0 17 13 7 27 4C26 18 25 26 9 30Z" fill="#62894b" fill-opacity=".2"/><path d="M7 34Q12 19 26 5M11 23Q4 21 4 16M16 16L24 15" stroke="#587847" stroke-width="1.4" stroke-linecap="round"/></svg><span class="brand-name">风与叶</span></div><span class="edition">BREEZE & LEAF / 主题样式</span></header>
      <svg class="wind" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" fill="none" aria-hidden="true">
        <g stroke="#f9ffe9"><path d="M-180 730C70 780 185 383 476 480S844 503 1065 263S1391 224 1590 44" stroke-width="22" opacity=".11"/><path d="M-180 713C70 763 185 366 476 463S844 486 1065 246S1391 207 1590 27" stroke-width="1.4" opacity=".35"/><path d="M-180 721C70 771 185 374 476 471S844 494 1065 254S1391 215 1590 35" stroke-width="1" opacity=".2"/></g>
        <g class="far" stroke="#f7ffe9"><path d="M-160 200C106 208 71 454 365 362S657 217 918 402S1254 616 1600 344" opacity=".18"/><path d="M-160 213C106 221 71 467 365 375S657 230 918 415S1254 629 1600 357" stroke-width="9" opacity=".07"/><path d="M890 974C992 752 1171 782 1329 629S1458 535 1510 555" opacity=".28"/></g>
      </svg>
      <div class="scattered" aria-hidden="true"><svg class="small-leaf"><use href="#small-leaf"/></svg><svg class="small-leaf"><use href="#small-leaf"/></svg><svg class="small-leaf"><use href="#small-leaf"/></svg><svg class="small-leaf"><use href="#small-leaf"/></svg><svg class="small-leaf"><use href="#small-leaf"/></svg><svg class="small-leaf"><use href="#small-leaf"/></svg></div>
      <main>
        <div class="leaf-stage">
          <svg class="main-leaf" viewBox="0 0 740 760" preserveAspectRatio="none" aria-hidden="true">
            <defs><filter id="leaf-shadow" x="-40%" y="-25%" width="190%" height="180%"><feDropShadow dx="16" dy="23" stdDeviation="19" flood-color="#567332" flood-opacity=".21"/></filter></defs>
            <path d="M247 716C231 654 129 638 111 519C84 343 228 200 367 157C456 130 501 91 530 39C518 107 554 157 589 213C660 324 638 461 561 554C476 655 349 650 247 716Z" fill="var(--leaf-white)" filter="url(#leaf-shadow)"/>
            <g fill="none" stroke="#dbe5cc" stroke-linecap="round"><path d="M232 749Q242 724 247 701" stroke-width="7"/><path d="M247 701Q259 643 279 612M280 612Q207 585 172 536M283 609Q428 625 511 561M424 171Q489 153 529 49M489 167Q528 194 548 226M193 294Q164 353 163 386" opacity=".45" stroke-width="1.3"/></g>
          </svg>
          <section class="login-look" aria-labelledby="welcome-title">
            <div class="eyebrow">A LITTLE FRESH AIR</div>
            <h1 id="welcome-title">听见，风的声音</h1>
            <p class="intro">让喜欢的旋律，自然发生。</p>
            <label class="field"><span class="field-name">邮箱</span><span class="input-wrap"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2" y="4" width="16" height="12" rx="3"/><path d="m3 6 7 5 7-5"/></svg><input type="email" placeholder="你的邮箱地址" readonly aria-describedby="preview-note" /></span></label>
            <label class="field"><span class="field-name">密码</span><span class="input-wrap"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3" y="8" width="14" height="10" rx="3"/><path d="M6 8V6a4 4 0 0 1 8 0v2M10 12v2"/></svg><input type="password" placeholder="你的登录密码" readonly aria-describedby="preview-note" /></span></label>
            <button class="login-button" type="button" disabled>登录</button>
            <p class="registration-look">还没有账号？<span>注册账号</span></p>
          </section>
        </div>
      </main>
      <aside class="side-note" aria-hidden="true"><p>一叶清新，一曲自在。</p><small>LET THE MUSIC FIND YOU.</small></aside>
      <p id="preview-note" class="quiet-note">嫩叶绿 · 主题预览 / 仅展示样式，不提供登录与注册</p>
    </div>
  </body>
</html>
